<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>GYMCOMP — Coach View</title>
  <style>
    @font-face {
      font-family: 'Saans';
      src: url('./SaansVF.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface2: #f0f0f0;
      --border: #e4e4e4;
      --text: #2e2e2e;
      --muted: #909090;
      --accent: #000dff;
      --accent-text: #ffffff;
      --accent-overlay: rgba(255,255,255,0.2);
      --accent-pill-bg: #cbcbff;
      --accent-pill-border: #000dff;
      --accent-pill-text: #000dff;
      --accent2: #625FD1;
      --accent3: #d4d3ff;
      --success: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --font: 'Saans', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────── */
    .site-header {
      background: var(--accent);
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-header-inner {
      max-width: 960px;
      margin: 0 auto;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo {
      font-family: var(--font);
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .view-badge {
      background: rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.9);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin-left: auto;
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Layout ──────────────────────────────────────────────── */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* ── Header band (matches public results styling) ────────── */
    .header-band {
      background: var(--accent);
      border-radius: 21px;
      padding: 32px 32px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
      min-height: 140px;
    }
    .header-band-text { flex: 1; min-width: 0; }
    .header-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .header-comp-title {
      font-size: 36px;
      font-weight: 600;
      line-height: 1.1;
      color: var(--accent-text);
    }
    .header-band .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-overlay);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 48px;
      white-space: nowrap;
      margin-left: 0;
    }
    .header-organiser {
      font-size: 16px;
      font-weight: 500;
      color: var(--accent-text);
      opacity: 0.85;
      margin-bottom: 4px;
    }
    .header-meta {
      font-size: 14px;
      color: var(--accent-text);
      opacity: 0.5;
    }
    .header-logo {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .header-logo img {
      max-height: 200px;
      max-width: 280px;
      width: auto;
      object-fit: contain;
      display: block;
    }
    .header-logo img.default-logo { width: 200px; }
    .powered-by {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 24px;
      font-size: 11px;
      color: var(--accent-text);
    }
    .powered-by img { height: 18px; width: auto; }

    .round-tabs {
      display: flex;
      justify-content: flex-end;
      gap: 24px;
      margin-bottom: 20px;
    }
    .round-tab {
      padding: 8px 4px;
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--text);
      opacity: 0.5;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .round-tab:hover { opacity: 0.8; }
    .round-tab.active { opacity: 1; border-bottom-color: var(--text); }

    .controls-row {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .control-pills { display: flex; gap: 6px; }
    .sort-pill {
      padding: 8px 18px;
      border-radius: 48px;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 0.15s;
      background: #e3e3e3;
      color: #202020;
    }
    .sort-pill.active { background: #000; border-color: #000; color: #fff; }

    .footer-band {
      background: var(--accent);
      border-radius: 21px;
      padding: 24px 32px;
      min-height: 81px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }
    .footer-powered {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-text);
      opacity: 0.7;
    }
    .footer-band img { height: 20px; width: auto; }

    /* ── Comp hero ───────────────────────────────────────────── */
    .comp-hero {
      margin-bottom: 28px;
    }
    .comp-title {
      font-family: var(--font);
      font-size: 36px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 10px;
      color: var(--text);
    }
    .comp-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── Round tabs ──────────────────────────────────────────── */
    .tab-btn {
      padding: 10px 20px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 0;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .filter-select {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 32px 6px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23909090' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }
    .filter-select:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .filter-clear {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border: none;
      border-radius: 8px;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }
    .filter-clear:hover { color: var(--text); }

    /* ── Gymnast card ────────────────────────────────────────── */
    .gymnast-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
    }
    .gymnast-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .gymnast-num {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }
    .gymnast-name {
      font-weight: 700;
      font-size: 20px;
      flex: 1;
      min-width: 0;
    }
    .gymnast-club {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .gymnast-overall {
      text-align: right;
      flex-shrink: 0;
      padding-left: 12px;
      border-left: 1px solid var(--border);
      margin-left: 4px;
    }
    .gymnast-overall-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .gymnast-overall-val {
      font-weight: 800;
      font-size: 30px;
      line-height: 1;
      color: var(--accent);
    }

    /* ── Apparatus grid ──────────────────────────────────────── */
    .apparatus-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 10px;
    }
    .app-block {
      background: var(--surface2);
      border-radius: 10px;
      padding: 12px;
      border: 1px solid transparent;
    }
    .app-block.dual {
      grid-column: span 2;
    }
    .app-block.queried {
      border-color: var(--warn);
      background: rgba(245, 158, 11, 0.04);
    }
    .app-block.resolved {
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.04);
    }
    .app-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .app-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .app-block .app-score {
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }
    .app-block .app-score.no-score { color: var(--muted); font-size: 16px; }
    .app-block .app-score.queried-val { color: var(--warn); font-size: 14px; }
    .app-breakdown {
      display: flex;
      gap: 6px;
    }
    .bd-cell {
      flex: 1;
      background: var(--surface);
      border-radius: 6px;
      padding: 6px 4px;
      text-align: center;
    }
    .bd-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .bd-val {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }
    .bd-val.na { color: var(--muted); font-weight: 500; }
    .bd-val.penalty { color: var(--danger); }

    .query-flag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 8px;
    }
    .query-flag.flagged {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warn);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .query-flag.resolved {
      background: rgba(34, 197, 94, 0.08);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .query-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      font-style: italic;
    }

    /* ── Level card (overall view) ─────────────────────────────── */
    .level-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .level-card-header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      font-size: 22px;
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── Controls layout ──────────────────────────────────────── */
    .results-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .results-toggle {
      display: flex;
      gap: 6px;
    }
    .results-rounds {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-left: auto;
    }
    .toggle-btn {
      padding: 7px 16px;
      border-radius: 56px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-btn.active {
      border-color: transparent;
      background: var(--accent3);
      color: var(--accent);
    }

    /* ── Overall table styles ──────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    /* ── Column widths (mobile) ── */
    @media (max-width: 767px) {
      td.gymnast-name, th:nth-child(2) { white-space: nowrap; }
      .gymnast-club-cell { white-space: nowrap; }
    }
    th {
      padding: 8px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr.dns-row td { opacity: 0.45; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-gold { background: rgba(245, 158, 11, 0.12); color: #d97706; }
    .badge-silver { background: rgba(148, 163, 184, 0.12); color: #64748b; }
    .badge-bronze { background: rgba(180, 83, 9, 0.12); color: #b45309; }
    .badge-medal { background: rgba(0, 13, 255, 0.07); color: #4a50c7; }
    .badge-rank { background: var(--surface2); color: var(--muted); }
    .badge-dns { background: rgba(144,144,144,0.1); color: var(--muted); }

    .score-total {
      font-weight: 800;
      font-size: 16px;
      color: var(--accent);
    }
    .app-score {
      color: var(--muted);
      font-size: 13px;
    }
    .gymnast-club-cell { font-weight: 500; color: var(--muted); max-width: 12ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.gymnast-name { font-size: 13px; font-weight: 500; }
    td.app-score, td.score-total-cell { text-align: center; }
    th.col-score { text-align: center; }

    /* ── Empty / loading / error states ─────────────────────── */
    .state-full {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 40px 20px;
    }
    .state-icon { font-size: 48px; margin-bottom: 8px; }
    .state-title { font-size: 20px; font-weight: 700; }
    .state-sub { color: var(--muted); font-size: 14px; max-width: 380px; line-height: 1.6; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }


    .info-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    /* ── Lock screen ─────────────────────────────────────────── */
    .lock-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      padding: 40px 20px;
    }
    .lock-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .lock-box .lock-icon { font-size: 48px; margin-bottom: 16px; }
    .lock-box .lock-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .lock-box .lock-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
    .lock-input {
      font-family: monospace;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
      padding: 14px 20px;
      border: 2px solid var(--border);
      border-radius: 12px;
      width: 100%;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .lock-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,13,255,0.1); }
    .lock-input.error { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.1); animation: shake 0.4s; }
    .lock-error { font-size: 12px; color: var(--danger); margin-top: 8px; font-weight: 600; min-height: 18px; }
    .lock-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 36px;
      border-radius: 56px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .lock-btn:hover { opacity: 0.9; }
    .lock-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    tr.my-club-row td { background: rgba(0,13,255,0.04); }

    @media (max-width: 600px) {
      .comp-title { font-size: 26px; }
      td, th { padding: 8px; font-size: 12px; }
      .apparatus-grid { grid-template-columns: 1fr 1fr; }
      .gymnast-card .gymnast-header { gap: 10px; }
      .gymnast-card .gymnast-num { width: 36px; height: 36px; font-size: 16px; }
      .gymnast-card .gymnast-name { font-size: 16px; }
      .gymnast-card .gymnast-club { display: none; }
      .gymnast-card .gymnast-overall-val { font-size: 18px; }
      .lock-box { padding: 32px 24px; }
    }
    @media (max-width: 400px) {
      .apparatus-grid { grid-template-columns: 1fr; }
    }

    /* ── Header band / chrome responsiveness (matches results.html) ── */
    @media (max-width: 768px) {
      .header-band {
        padding: 20px;
        border-radius: 16px;
        min-height: auto;
        flex-direction: column-reverse;
        align-items: flex-start;
        gap: 32px;
      }
      .header-comp-title { font-size: 24px; }
      .header-organiser { font-size: 14px; }
      .header-meta { font-size: 12px; }
      .header-logo { align-self: stretch; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
      .header-logo img { max-height: 80px; max-width: 200px; }
      .powered-by { margin-top: 0; flex-direction: column; align-items: flex-end; }

      .round-tabs { justify-content: flex-start; overflow-x: auto; gap: 16px; -webkit-overflow-scrolling: touch; }
      .round-tab { white-space: nowrap; font-size: 14px; flex-shrink: 0; }

      .controls-row { flex-direction: column; align-items: stretch; gap: 16px; }
      .control-pills { flex-wrap: wrap; }

      .level-card { border-radius: 12px; }
      .level-card-header { padding: 14px 16px; font-size: 18px; }

      .footer-band { border-radius: 12px; padding: 16px; min-height: 60px; }
    }

    @media (max-width: 767px) {
      .results-controls {
        flex-direction: column;
        align-items: stretch;
        gap: 24px;
      }
      .results-rounds {
        order: -1;
        margin-left: 0;
      }
      .results-filters {
        width: 100%;
      }
      .results-filters .filter-select {
        flex: 1;
      }
    }
  </style>
</head>
<body>

<main class="page" id="main">
  <div class="state-full">
    <div class="spinner"></div>
    <div class="state-title">Loading…</div>
  </div>
</main>

<script type="module">
  // Shared ranking module — module scripts execute during parse, before any
  // data has been fetched, so the classic script below can safely call these
  // from its render functions.
  import * as ranking from "./shared/ranking.js";
  window.GymCompRanking = ranking;
</script>
<script>
  const SUPABASE_URL = "https://xjuwbgitqsvrmoejvzwb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_7jhhejhXAH8hlX-gnsElnA_1ih0G-2f";
  const POLL_MS = 10000;

  let activeRound = null;
  let activeView = "myclub"; // "myclub" | "overall"
  let clubFilter = "all";
  let levelFilter = "all";
  let ageFilter = "all";
  let pollTimer = null;
  let compData = null;
  let gymnasts = [];
  let scores = {};

  // ── Club auth state ──
  let authedClubCode = null;  // e.g. "UGC-4821"
  let authedClubName = null;  // resolved from compData on each poll

  // ── Club colour ──
  const CLUB_COLOURS = [
    "#6366f1","#8b5cf6","#a855f7","#d946ef","#ec4899",
    "#f43f5e","#ef4444","#f97316","#f59e0b","#eab308",
    "#84cc16","#22c55e","#14b8a6","#06b6d4","#0ea5e9",
    "#3b82f6","#6d28d9","#be185d","#b45309","#0d9488"
  ];
  // ── Contrast utility (mirrors src/lib/utils.js) ──
  function getContrastTextColor(hex) {
    if (!hex || hex.length < 7) return "#ffffff";
    const r = parseInt(hex.slice(1, 3), 16) / 255;
    const g = parseInt(hex.slice(3, 5), 16) / 255;
    const b = parseInt(hex.slice(5, 7), 16) / 255;
    const toLinear = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    const L = 0.2126 * toLinear(r) + 0.7152 * toLinear(g) + 0.0722 * toLinear(b);
    return L > 0.179 ? "#000000" : "#ffffff";
  }

  // ── Apply branding CSS variables (matches results.html) ──
  function applyBranding(cd) {
    const brandColor = cd.brandColor || "";
    const accent = brandColor || "#000dff";
    const accentText = brandColor ? getContrastTextColor(brandColor) : "#ffffff";
    const isLight = accentText === "#000000";
    const rr = parseInt(accent.slice(1, 3), 16);
    const gg = parseInt(accent.slice(3, 5), 16);
    const bb = parseInt(accent.slice(5, 7), 16);
    const root = document.documentElement.style;
    root.setProperty("--accent", accent);
    root.setProperty("--accent-text", accentText);
    root.setProperty("--accent-overlay", isLight ? "rgba(0,0,0,0.08)" : "rgba(255,255,255,0.2)");
    root.setProperty("--accent-pill-bg", isLight ? `rgba(${rr},${gg},${bb},0.15)` : "#cbcbff");
    root.setProperty("--accent-pill-border", accent);
    root.setProperty("--accent-pill-text", accent);
  }

  const clubColourCache = {};
  function clubColour(name) {
    if (!name) return "var(--muted)";
    if (clubColourCache[name]) return clubColourCache[name];
    let h = 0;
    for (let i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) | 0;
    clubColourCache[name] = CLUB_COLOURS[Math.abs(h) % CLUB_COLOURS.length];
    return clubColourCache[name];
  }

  // ── URL param ──
  const params = new URLSearchParams(location.search);
  const compId = params.get("comp");

  // ── Score key helpers (key format from the shared ranking module) ──
  const sk = (rid, gid, app) => window.GymCompRanking.gymnast_key(rid, gid, app);
  const subKey = (rid, gid, app, sub) => `${sk(rid, gid, app)}__${sub}`;
  const sv = (rid, gid, app, sub) => parseFloat(scores[subKey(rid, gid, app, sub)]) || 0;
  const getTotal = (rid, gid, app) => parseFloat(scores[sk(rid, gid, app)]) || 0;
  const getScoringApparatus = () => (compData?.apparatus || []).filter(a => a !== "Rest");
  const getOverall = (rid, gid) => getScoringApparatus().reduce((s, a) => s + getTotal(rid, gid, a), 0);

  const judgeCount = (app) =>
    (compData.judges || []).filter(j => j.apparatus === app).length;

  // FIG execution baseline: E = start value − deduction (per-comp setting)
  const eScoreStart = () => {
    const v = parseFloat(compData && compData.eScoreStart);
    return isNaN(v) || v <= 0 ? 10 : v;
  };

  const getEAvg = (rid, gid, app) => {
    const n = Math.max(judgeCount(app), 1);
    let sum = 0, count = 0;
    for (let i = 1; i <= n; i++) {
      const v = sv(rid, gid, app, `e${i}`);
      if (!isNaN(v)) { sum += (eScoreStart() - v); count++; }
    }
    return count > 0 ? sum / count : 0;
  };

  const getEDeductionAvg = (rid, gid, app) => {
    const n = Math.max(judgeCount(app), 1);
    let sum = 0, count = 0;
    for (let i = 1; i <= n; i++) {
      const v = sv(rid, gid, app, `e${i}`);
      if (!isNaN(v) && v > 0) { sum += v; count++; }
    }
    return count > 0 ? sum / count : 0;
  };

  const fmt = (v) => v > 0 ? v.toFixed(3) : "—";
  const fmt2 = (v) => v > 0 ? v.toFixed(3) : "—";

  // ── Filter helpers ──
  function getUniqueClubs() {
    return [...new Set(gymnasts.map(g => g.club || "").filter(Boolean))].sort();
  }

  function setClubFilterVal(val) {
    clubFilter = val;
    renderPage();
  }

  function clearFilters() {
    clubFilter = "all";
    levelFilter = "all";
    ageFilter = "all";
    renderPage();
  }

  function getUniqueLevels(rid) {
    const roundG = gymnasts.filter(g => g.round === rid);
    const present = new Set(roundG.map(g => {
      const lo = (compData.levels || []).find(l => l.id === g.level);
      return lo ? lo.name : "Unknown";
    }));
    const ordered = (compData.levels || []).map(l => l.name).filter(n => present.has(n));
    if (present.has("Unknown")) ordered.push("Unknown");
    return ordered;
  }

  function getUniqueAges(rid) {
    const roundG = gymnasts.filter(g => g.round === rid);
    const selectedLevelObj = (compData.levels || []).find(l => l.name === levelFilter);
    if (!selectedLevelObj || selectedLevelObj.rankBy !== "level+age") return [];
    return [...new Set(roundG.filter(g => {
      const lo = (compData.levels || []).find(l => l.id === g.level);
      return (lo ? lo.name : "Unknown") === levelFilter;
    }).map(g => g.age || "Age not set"))].sort();
  }

  function isAgeFilterEnabled() {
    if (levelFilter === "all") return false;
    const lo = (compData.levels || []).find(l => l.name === levelFilter);
    return lo && lo.rankBy === "level+age";
  }

  function setLevelFilterVal(val) {
    levelFilter = val;
    ageFilter = "all";
    renderPage();
  }

  function setAgeFilterVal(val) {
    ageFilter = val;
    renderPage();
  }

  function buildFilterHtml() {
    if (activeView === "myclub") return "";
    if (activeView === "overall") {
      const rid = activeRound;
      const levels = getUniqueLevels(rid);
      if (levels.length < 2) return "";
      const ages = getUniqueAges(rid);
      const showAge = isAgeFilterEnabled();
      const hasActive = levelFilter !== "all" || ageFilter !== "all";
      return `
        <div class="results-filters" style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
          <select class="filter-select" onchange="setLevelFilterVal(this.value)">
            <option value="all"${levelFilter === "all" ? " selected" : ""}>All Levels</option>
            ${levels.map(l => `<option value="${escHtml(l)}"${l === levelFilter ? " selected" : ""}>${escHtml(l)}</option>`).join("")}
          </select>
          <select class="filter-select" onchange="setAgeFilterVal(this.value)" ${showAge ? "" : "disabled"}>
            <option value="all"${ageFilter === "all" ? " selected" : ""}>All Ages</option>
            ${ages.map(a => `<option value="${escHtml(a)}"${a === ageFilter ? " selected" : ""}>${escHtml(a)}</option>`).join("")}
          </select>
          ${hasActive ? `<button class="filter-clear" onclick="clearFilters()">Clear</button>` : ""}
        </div>
      `;
    }
    const clubs = getUniqueClubs();
    if (clubs.length < 2) return "";
    return `
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:20px;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px">Filter by Club</span>
        <select class="filter-select" onchange="setClubFilterVal(this.value)" style="border-left:3px solid ${clubFilter !== "all" ? clubColour(clubFilter) : "var(--border)"}">
          <option value="all"${clubFilter === "all" ? " selected" : ""}>All Clubs</option>
          ${clubs.map(c => `<option value="${escHtml(c)}"${c === clubFilter ? " selected" : ""}>${escHtml(c)}</option>`).join("")}
        </select>
        ${clubFilter !== "all" ? `<button class="filter-clear" onclick="clearFilters()">Clear</button>` : ""}
      </div>
    `;
  }

  // ── Lock screen ──
  function renderLockScreen() {
    document.getElementById("main").innerHTML = `
      <div class="lock-screen">
        <div class="lock-box">
          <div class="lock-icon">🔐</div>
          <div class="lock-title">Club Access</div>
          <div class="lock-sub">Enter your Club ID to view your gymnasts' scores and results. Your organiser can provide this code.</div>
          <input class="lock-input" id="clubCodeInput" type="text" maxlength="8" placeholder="ABC-1234"
            oninput="formatClubInput(this)" onkeydown="if(event.key==='Enter')submitClubCode()" />
          <div class="lock-error" id="lockError"></div>
          <button class="lock-btn" onclick="submitClubCode()">Enter</button>
        </div>
      </div>
    `;
    document.getElementById("clubCodeInput").focus();
  }

  function formatClubInput(el) {
    let v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (v.length > 3) v = v.slice(0, 3) + "-" + v.slice(3);
    if (v.length > 8) v = v.slice(0, 8);
    el.value = v;
    // Clear error on input
    const errEl = document.getElementById("lockError");
    if (errEl) errEl.textContent = "";
    el.classList.remove("error");
  }

  function submitClubCode() {
    const input = document.getElementById("clubCodeInput");
    const code = (input.value || "").trim().toUpperCase();
    const errEl = document.getElementById("lockError");

    if (!code || code.length < 8) {
      input.classList.add("error");
      errEl.textContent = "Please enter a valid Club ID (e.g. ABC-1234)";
      return;
    }

    // Validate against compData clubs
    const club = (compData.clubs || []).find(c => c.clubCode === code);
    if (!club) {
      input.classList.add("error");
      errEl.textContent = "Club ID not recognised. Please check and try again.";
      return;
    }

    // Success — authenticate
    authedClubCode = code;
    authedClubName = club.name;
    activeView = "myclub";

    // Persist in sessionStorage
    try { sessionStorage.setItem("coach_club_" + compId, code); } catch {}

    // Render the coach view
    renderPage();
    updateTimestamp();
    { const lp = document.getElementById("livePill"); if (lp) lp.style.display = "inline-flex"; }

    // Start polling
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => poll(), POLL_MS);
  }

  function resolveClubName() {
    if (!authedClubCode || !compData) return;
    const club = (compData.clubs || []).find(c => c.clubCode === authedClubCode);
    if (club) authedClubName = club.name;
  }

  // ── Competition ranking (shared implementation; mode from compData) ──
  function standardRank(items, scoreKey) {
    const mode = (compData && compData.rankingMode) || "standard";
    return window.GymCompRanking.denseRank(items, scoreKey, mode);
  }

  function rankBadge(rank) {
    if (rank === null) return `<span class="badge badge-dns">DNS</span>`;
    if (rank === 1) return `<span class="badge badge-gold">🥇 1st</span>`;
    if (rank === 2) return `<span class="badge badge-silver">🥈 2nd</span>`;
    if (rank === 3) return `<span class="badge badge-bronze">🥉 3rd</span>`;
    if (rank <= 6) return `<span class="badge badge-medal">🎖️ ${rank}th</span>`;
    return `<span class="badge badge-rank">${rank}th</span>`;
  }

  function renderOverallView(round) {
    const rid = round.id;
    const allGroups = buildRankGroups(rid);
    const groups = allGroups.filter(rg => {
      if (levelFilter !== "all" && rg.levelName !== levelFilter) return false;
      if (ageFilter !== "all" && rg.ageLabel !== ageFilter) return false;
      return rg.gymnasts.length > 0;
    });

    const apparatus = getScoringApparatus();
    if (!groups.length) return `${buildFilterHtml()}<div style="color:var(--muted);font-size:13px;padding:20px 0">No results to display.</div>`;

    return buildFilterHtml() + groups.map(({ levelName, ageLabel, crossRound, roundIds, gymnasts: glist }) => {
      const agePill = ageLabel ? `<span class="age-pill">${escHtml(ageLabel)}</span>` : "";
      const withTotals = glist.map(g => ({ ...g, total: getOverall(g.round, g.id) }));
      const ranked = standardRank(withTotals.filter(g => g.total > 0 && !g.dns), "total");
      const unscored = withTotals.filter(g => g.total === 0 && !g.dns);
      const dns = withTotals.filter(g => !!g.dns);

      // Find top score per apparatus for highlighting
      const topScores = {};
      apparatus.forEach(a => {
        let best = 0;
        glist.forEach(g => { if (!g.dns) { const s = getTotal(g.round, g.id, a); if (s > best) best = s; } });
        if (best > 0) topScores[a] = best;
      });

      const appHeaders = apparatus.map(a => `<th class="col-score">${escHtml(a)}</th>`).join("");

      const rows = [
        ...ranked.map(g => {
          const isMyClub = authedClubName && (g.club || "") === authedClubName;
          const appCells = apparatus.map(a => {
            const s = getTotal(g.round, g.id, a);
            const isTop = s > 0 && topScores[a] && s === topScores[a];
            return `<td class="app-score"${isTop ? ' style="background:rgba(0,13,255,0.08);color:var(--accent);font-weight:700"' : ''}>${s > 0 ? s.toFixed(3) : "—"}</td>`;
          }).join("");
          return `
            <tr${isMyClub ? ' class="my-club-row"' : ''}>
              <td>${rankBadge(g.rank)}</td>

              <td class="gymnast-name">${escHtml(g.name)}</td>
              <td class="gymnast-club-cell">${escHtml(g.club || "")}</td>
              ${appCells}
              <td class="score-total-cell"><span class="score-total">${g.total.toFixed(3)}</span></td>
            </tr>
          `;
        }),
        ...unscored.sort(byRunningOrder(rid)).map(g => {
          const isMyClub = authedClubName && (g.club || "") === authedClubName;
          const appCells = apparatus.map(a => {
            const s = getTotal(g.round, g.id, a);
            return `<td class="app-score"${s > 0 ? '' : ' style="color:var(--muted)"'}>${s > 0 ? s.toFixed(3) : "—"}</td>`;
          }).join("");
          return `
            <tr${isMyClub ? ' class="my-club-row"' : ''}>
              <td></td>

              <td class="gymnast-name">${escHtml(g.name)}</td>
              <td class="gymnast-club-cell">${escHtml(g.club || "")}</td>
              ${appCells}
              <td class="score-total-cell" style="color:var(--muted)">—</td>
            </tr>
          `;
        }),
        ...dns.map(g => {
          const isMyClub = authedClubName && (g.club || "") === authedClubName;
          const appCells = apparatus.map(() => `<td class="app-score" style="color:var(--muted)">—</td>`).join("");
          return `
            <tr class="${isMyClub ? 'my-club-row ' : ''}dns-row">
              <td>${rankBadge(null)}</td>

              <td>${escHtml(g.name)}</td>
              <td style="color:var(--muted)">${escHtml(g.club || "")}</td>
              ${appCells}
              <td class="score-total-cell" style="color:var(--muted)">—</td>
            </tr>
          `;
        })
      ].join("");

      const hasAnyScore = withTotals.some(g => g.total > 0);

      // If no scores yet, show all gymnasts in running order without ranks
      let finalRows = rows;
      if (!hasAnyScore) {
        const sorted = [...withTotals].filter(g => !g.dns).sort(byRunningOrder(rid));
        const dnsOnly = withTotals.filter(g => !!g.dns);
        finalRows = [
          ...sorted.map(g => {
            const isMyClub = authedClubName && (g.club || "") === authedClubName;
            const appCells = apparatus.map(() => `<td class="app-score" style="color:var(--muted)">—</td>`).join("");
            return `
              <tr${isMyClub ? ' class="my-club-row"' : ''}>
                <td></td>
  
                <td class="gymnast-name">${escHtml(g.name)}</td>
                <td class="gymnast-club-cell">${escHtml(g.club || "")}</td>
                ${appCells}
                <td class="score-total-cell" style="color:var(--muted)">—</td>
              </tr>
            `;
          }),
          ...dnsOnly.map(g => {
            const isMyClub = authedClubName && (g.club || "") === authedClubName;
            const appCells = apparatus.map(() => `<td class="app-score" style="color:var(--muted)">—</td>`).join("");
            return `
              <tr class="${isMyClub ? 'my-club-row ' : ''}dns-row">
                <td>${rankBadge(null)}</td>
  
                <td>${escHtml(g.name)}</td>
                <td style="color:var(--muted)">${escHtml(g.club || "")}</td>
                ${appCells}
                <td class="score-total-cell" style="color:var(--muted)">—</td>
              </tr>
            `;
          })
        ].join("");
      }

      return `
        <div class="level-card">
          <div class="level-card-header">${escHtml(levelName)}${agePill ? ` <span style="font-size:14px;font-weight:600;color:var(--text);background:${ageColor(ageLabel)};padding:4px 12px;border-radius:99px">${escHtml(ageLabel)}</span>` : ""}${crossRoundPill(crossRound, roundIds)}</div>
          <div style="padding:16px 20px">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Rank</th><th>Gymnast</th><th>Club</th>
                    ${appHeaders}
                    <th class="col-score">Total</th>
                  </tr>
                </thead>
                <tbody>${finalRows}</tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  function switchView(v) {
    activeView = v;
    renderPage();
  }

  // ── Fetch ──
  async function fetchData() {
    if (!compId) return null;
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/competitions?id=eq.${encodeURIComponent(compId)}&select=*`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    if (!res.ok) return null;
    const rows = await res.json();
    return rows[0] || null;
  }

  // Fetch scores from the dedicated scores table (anon key)
  async function fetchTableScores() {
    if (!compId) return [];
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/scores?comp_id=eq.${encodeURIComponent(compId)}&select=*`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
      );
      if (!res.ok) return [];
      return await res.json();
    } catch { return []; }
  }

  // Convert scores table rows → flat object
  function scoresToFlat(rows) {
    const flat = {};
    for (const row of rows) {
      const bk = `${row.round_id}__${row.gymnast_id}__${row.apparatus}`;
      flat[bk] = row.final_score != null ? String(row.final_score) : "";

      const eScores = row.e_scores;

      // Dual vault: e_scores is an object with dualVault flag
      if (eScores && typeof eScores === "object" && !Array.isArray(eScores) && eScores.dualVault) {
        flat[`${bk}__dualVault`] = "1";
        for (const prefix of ["v1", "v2"]) {
          const v = eScores[prefix];
          if (!v) continue;
          if (v.d != null) flat[`${bk}__${prefix}dv`] = String(v.d);
          if (v.e && Array.isArray(v.e)) {
            for (let i = 0; i < v.e.length; i++) {
              if (v.e[i] != null) flat[`${bk}__${prefix}e${i + 1}`] = String(v.e[i]);
            }
          }
          if (v.bon != null && v.bon !== 0) flat[`${bk}__${prefix}bon`] = String(v.bon);
          if (v.pen != null && v.pen !== 0) flat[`${bk}__${prefix}pen`] = String(v.pen);
          if (v.final != null) flat[`${bk}__${prefix}fin`] = String(v.final);
        }
        continue;
      }

      // Normal score
      if (row.d_score != null) flat[`${bk}__dv`] = String(row.d_score);
      if (row.bonus != null && row.bonus !== 0) flat[`${bk}__bon`] = String(row.bonus);
      if (row.penalty != null && row.penalty !== 0) flat[`${bk}__pen`] = String(row.penalty);
      const eArr = eScores || [];
      if (Array.isArray(eArr)) {
        for (let i = 0; i < eArr.length; i++) {
          if (eArr[i] != null) flat[`${bk}__e${i + 1}`] = String(eArr[i]);
        }
      }
    }
    return flat;
  }

  // ── Render helpers ──
  function renderApparatusBlock(rid, gid, app) {
    const fig = (compData && compData.scoringMode) !== "simple";
    const total = getTotal(rid, gid, app);
    const isQueried = !!scores[subKey(rid, gid, app, "query")];
    const isResolved = !!scores[subKey(rid, gid, app, "queryResolved")];
    const queryNote = scores[subKey(rid, gid, app, "queryNote")] || "";

    const isDual = !!scores[subKey(rid, gid, app, "dualVault")];
    const v2HasData = isDual && parseFloat(scores[subKey(rid, gid, app, "v2fin")]) > 0;
    let blockClass = "app-block";
    if (isDual && v2HasData) blockClass += " dual";
    if (isQueried && !isResolved) blockClass += " queried";
    if (isResolved) blockClass += " resolved";

    // Score display
    let scoreClass = "app-score";
    if (!total) scoreClass += " no-score";
    if (isQueried && !isResolved) scoreClass += " queried-val";
    const displayVal = (isQueried && !isResolved)
      ? "Under Review"
      : (total > 0 ? total.toFixed(3) : "—");

    // Breakdown cells
    let breakdownHtml = "";
    const bdFmt = (v) => v > 0 ? v.toFixed(2) : "0";

    if (fig && isDual) {
      // Dual vault breakdown — full D/E/B/P for each vault, side by side
      const v1fin = parseFloat(scores[subKey(rid, gid, app, "v1fin")]) || 0;
      const v2fin = parseFloat(scores[subKey(rid, gid, app, "v2fin")]) || 0;

      const vaultHalf = (prefix, label, fin) => {
        const dv = parseFloat(scores[subKey(rid, gid, app, `${prefix}dv`)]) || 0;
        const n = Math.max(judgeCount(app), 1);
        let eSum = 0, eCnt = 0;
        for (let i = 1; i <= n; i++) {
          const v = parseFloat(scores[subKey(rid, gid, app, `${prefix}e${i}`)]);
          if (!isNaN(v) && v > 0) { eSum += v; eCnt++; }
        }
        const eDed = eCnt > 0 ? eSum / eCnt : 0;
        const bon = parseFloat(scores[subKey(rid, gid, app, `${prefix}bon`)]) || 0;
        const pen = parseFloat(scores[subKey(rid, gid, app, `${prefix}pen`)]) || 0;
        if (fin > 0) {
          return `
            <div style="flex:1">
              <div class="app-breakdown">
                <div class="bd-cell"><span class="bd-label">D</span><span class="bd-val">${bdFmt(dv)}</span></div>
                <div class="bd-cell"><span class="bd-label">E</span><span class="bd-val">${bdFmt(eDed)}</span></div>
                <div class="bd-cell"><span class="bd-label">B</span><span class="bd-val">${bdFmt(bon)}</span></div>
                <div class="bd-cell"><span class="bd-label">P</span><span class="bd-val${pen > 0 ? " penalty" : ""}">${pen > 0 ? pen.toFixed(2) : "0"}</span></div>
              </div>
              <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent);margin-top:4px">${label} <span style="float:right;font-size:12px;font-weight:800;color:var(--text)">${fin.toFixed(3)}</span></div>
            </div>
          `;
        }
        return `
          <div style="flex:1">
            <div class="app-breakdown">
              <div class="bd-cell"><span class="bd-label">D</span><span class="bd-val na">—</span></div>
              <div class="bd-cell"><span class="bd-label">E</span><span class="bd-val na">—</span></div>
              <div class="bd-cell"><span class="bd-label">B</span><span class="bd-val na">—</span></div>
              <div class="bd-cell"><span class="bd-label">P</span><span class="bd-val na">—</span></div>
            </div>
            <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-top:4px">${label}</div>
          </div>
        `;
      };

      if (v2HasData) {
        breakdownHtml = `
          <div style="display:flex;gap:8px">${vaultHalf("v1", "Vault 1", v1fin)}${vaultHalf("v2", "Vault 2", v2fin)}</div>
        `;
      } else {
        breakdownHtml = vaultHalf("v1", "Vault 1", v1fin);
      }
    } else if (fig) {
      const dv = sv(rid, gid, app, "dv");
      const eDeduction = getEDeductionAvg(rid, gid, app);
      const bonus = sv(rid, gid, app, "bon");
      const pen = sv(rid, gid, app, "pen");

      if (total > 0) {
        breakdownHtml = `
          <div class="app-breakdown">
            <div class="bd-cell"><span class="bd-label">D</span><span class="bd-val">${bdFmt(dv)}</span></div>
            <div class="bd-cell"><span class="bd-label">E</span><span class="bd-val">${bdFmt(eDeduction)}</span></div>
            <div class="bd-cell"><span class="bd-label">B</span><span class="bd-val">${bdFmt(bonus)}</span></div>
            <div class="bd-cell"><span class="bd-label">P</span><span class="bd-val${pen > 0 ? " penalty" : ""}">${pen > 0 ? pen.toFixed(2) : "0"}</span></div>
          </div>
        `;
      } else {
        breakdownHtml = `
          <div class="app-breakdown">
            <div class="bd-cell"><span class="bd-label">D</span><span class="bd-val na">—</span></div>
            <div class="bd-cell"><span class="bd-label">E</span><span class="bd-val na">—</span></div>
            <div class="bd-cell"><span class="bd-label">B</span><span class="bd-val na">—</span></div>
            <div class="bd-cell"><span class="bd-label">P</span><span class="bd-val na">—</span></div>
          </div>
        `;
      }
    } else {
      // Simple mode — single final score, no D/E breakdown to show
      breakdownHtml = "";
    }

    let queryHtml = "";
    if (isQueried && !isResolved) {
      queryHtml = `<span class="query-flag flagged">Under Review</span>`;
      if (queryNote) queryHtml += `<div class="query-note">${escHtml(queryNote)}</div>`;
    } else if (isResolved) {
      queryHtml = `<span class="query-flag resolved">Query Resolved</span>`;
    }

    return `
      <div class="${blockClass}">
        <div class="app-top">
          <span class="app-name">${escHtml(app)}</span>
          <span class="${scoreClass}">${displayVal}</span>
        </div>
        ${breakdownHtml}
        ${queryHtml}
      </div>
    `;
  }

  function renderGymnastCard(rid, g) {
    const gr = g.round || rid; // gymnast's own round (cross-round levels pool rounds)
    const overall = getOverall(gr, g.id);
    const apparatus = getScoringApparatus();

    const appBlocksHtml = apparatus
      .map(app => renderApparatusBlock(gr, g.id, app))
      .join("");

    return `
      <div class="gymnast-card">
        <div class="gymnast-header">
          <div class="gymnast-num">${escHtml(String(g.number || "—"))}</div>
          <div class="gymnast-name">${escHtml(g.name)}</div>
          ${g.club ? `<div class="gymnast-club" style="background:${clubColour(g.club)}">${escHtml(g.club)}</div>` : ""}
          <div class="gymnast-overall">
            <div class="gymnast-overall-label">Overall</div>
            <div class="gymnast-overall-val">${overall > 0 ? overall.toFixed(3) : "—"}</div>
          </div>
        </div>
        <div class="apparatus-grid">${appBlocksHtml}</div>
      </div>
    `;
  }

  // Running-order sort (shared implementation): rotations in the round's
  // configured order, then orderIndex within the rotation.
  function byRunningOrder(rid) {
    return window.GymCompRanking.roundRunningOrderCompare(compData, rid);
  }

  // Age pill colours — same pastel scheme as the organiser app, indexed by
  // first appearance across the whole competition so colours match everywhere
  const AGE_PILL_COLORS = ["#E8D5F5","#D5E8F5","#D5F5E0","#F5EAD5","#F5D5D5","#D5F5F0","#F5D5EA","#E0F5D5","#D5D5F5","#F5F0D5"];
  function ageColor(age) {
    const ages = [];
    (gymnasts || []).forEach(g => { if (g.age && !ages.includes(g.age)) ages.push(g.age); });
    const i = ages.indexOf(age);
    return i >= 0 ? AGE_PILL_COLORS[i % AGE_PILL_COLORS.length] : "var(--surface)";
  }

  // Pill shown on a level ranked across rounds
  function crossRoundPill(crossRound, roundIds) {
    if (!crossRound) return "";
    const names = (roundIds || []).map(r => ((compData.rounds || []).find(x => x.id === r) || {}).name || "").filter(Boolean).join(" & ");
    return ` <span style="font-size:14px;font-weight:600;color:var(--text);background:transparent;border:1px solid var(--text);padding:4px 12px;border-radius:99px">Ranked across ${escHtml(names)}</span>`;
  }

  // Build level groups (shared implementation, converged defaults)
  function buildRankGroups(rid) {
    return window.GymCompRanking.buildRankGroups(gymnasts, {
      levels: (compData.levels || []),
      roundId: rid,
      rounds: (compData.rounds || []),
    });
  }

  function buildRoundContent(round) {
    const rid = round.id;
    const roundGymnasts = gymnasts.filter(g => g.round === rid);

    if (!roundGymnasts.length) {
      return `<div style="color:var(--muted);font-size:13px;padding:20px 0">No gymnasts in this round.</div>`;
    }

    const allGroups = buildRankGroups(rid);

    // In "myclub" view, filter to authed club only
    const groups = allGroups.map(rg => {
      let filtered = rg.gymnasts;
      if (activeView === "myclub" && authedClubName) {
        filtered = filtered.filter(g => (g.club || "") === authedClubName);
      } else if (clubFilter !== "all") {
        filtered = filtered.filter(g => (g.club || "") === clubFilter);
      }
      return { ...rg, gymnasts: filtered };
    }).filter(rg => rg.gymnasts.length > 0);

    if (!groups.length) {
      return `${buildFilterHtml()}<div style="color:var(--muted);font-size:13px;padding:20px 0;text-align:center">No gymnasts from your club in this round.</div>`;
    }

    return buildFilterHtml() + groups.map(({ levelName, ageLabel, crossRound, roundIds, gymnasts: glist }) => {
      const agePill = ageLabel ? `<span class="age-pill">${escHtml(ageLabel)}</span>` : "";
      const sortedGymnasts = [...glist].sort(byRunningOrder(rid));
      return `
        <div class="level-card">
          <div class="level-card-header">${escHtml(levelName)}${ageLabel ? ` <span style="font-size:14px;font-weight:600;color:var(--text);background:${ageColor(ageLabel)};padding:4px 12px;border-radius:99px">${escHtml(ageLabel)}</span>` : ""}${crossRoundPill(crossRound, roundIds)}</div>
          <div style="padding:16px 20px">
            ${sortedGymnasts.map(g => renderGymnastCard(rid, g)).join("")}
          </div>
        </div>
      `;
    }).join("");
  }

  function renderPage() {
    const rounds = compData.rounds || [];
    if (!activeRound && rounds.length) activeRound = rounds[0].id;

    // Brand theming — same variables and header band as the public results page
    applyBranding(compData);
    const accentText = compData.brandColor ? getContrastTextColor(compData.brandColor) : "#ffffff";
    const isLight = accentText === "#000000";

    const currentRound = rounds.find(r => r.id === activeRound) || rounds[0];
    const roundContent = currentRound
      ? (activeView === "overall" ? renderOverallView(currentRound) : buildRoundContent(currentRound))
      : "";

    // Re-resolve club name in case it was renamed
    resolveClubName();

    const dateStr = compData.date
      ? new Date(compData.date + "T12:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" })
      : "";
    const venue = compData.venue || compData.location || "";
    const brandLogo = compData.brandLogoSvgUrl || compData.brandLogoUrl || "";
    const defaultLogo = isLight ? "./logo.svg" : "./Logo-mono-white.svg";
    const logoSrc = brandLogo || defaultLogo;
    const footerLogoSrc = isLight ? "./logo.svg" : "./Logo-mono-white.svg";

    const queryCount = countActiveQueries();

    const headerHtml = `<div class="header-band">
      <div class="header-band-text">
        <div class="header-title-row">
          <div class="header-comp-title">${escHtml(compData.name || "Competition")}</div>
          <div class="live-pill" id="livePill" style="display:none">
            <span class="live-dot"></span> LIVE
          </div>
        </div>
        ${compData.organiserName ? `<div class="header-organiser">${escHtml(compData.organiserName)}</div>` : ""}
        <div class="header-meta">${[dateStr, escHtml(venue)].filter(Boolean).join("  ·  ")}</div>
      </div>
      <div class="header-logo">
        <img src="${logoSrc}" alt=""${brandLogo ? ' crossorigin="anonymous"' : ""} class="${brandLogo ? '' : 'default-logo'}" />
        ${brandLogo ? `<div class="powered-by">Live Scoring Powered by <img src="${isLight ? "./logo.svg" : "./Logo-mono-white.svg"}" alt="GymComp" /></div>` : ""}
      </div>
    </div>`;

    const roundTabsHtml = rounds.length > 1 ? `<div class="round-tabs">
      ${rounds.map(r => `<button class="round-tab ${r.id === activeRound ? "active" : ""}"
        onclick="switchRound('${r.id}')">${escHtml(r.name)}</button>`).join("")}
    </div>` : "";

    const controlsHtml = `<div class="controls-row">
      <div class="control-group">
        <div class="control-label">View</div>
        <div class="control-pills">
          <button class="sort-pill ${activeView === "myclub" ? "active" : ""}" onclick="switchView('myclub')">My Club</button>
          <button class="sort-pill ${activeView === "overall" ? "active" : ""}" onclick="switchView('overall')">Overall</button>
        </div>
      </div>
    </div>`;

    const footerHtml = `<div class="footer-band">
      <span class="footer-powered">Powered by</span>
      <img src="${footerLogoSrc}" alt="GymComp" />
    </div>`;

    document.getElementById("main").innerHTML = `
      ${headerHtml}
      ${roundTabsHtml}

      ${queryCount > 0 ? `
        <div class="info-bar" style="border-color:rgba(245,158,11,0.3);background:rgba(245,158,11,0.04)">
          <span style="color:var(--warn);font-weight:700">⚠ ${queryCount} active ${queryCount === 1 ? "query" : "queries"} under review</span>
        </div>
      ` : ""}

      ${controlsHtml}
      ${roundContent}
      ${footerHtml}
    `;
  }

  function countActiveQueries() {
    let count = 0;
    gymnasts.forEach(g => {
      getScoringApparatus().forEach(app => {
        (compData.rounds || []).forEach(r => {
          if (scores[subKey(r.id, g.id, app, "query")] && !scores[subKey(r.id, g.id, app, "queryResolved")]) {
            count++;
          }
        });
      });
    });
    return count;
  }

  function switchRound(rid) {
    activeRound = rid;
    levelFilter = "all";
    ageFilter = "all";
    renderPage();
  }

  function updateTimestamp() {
    const el = document.getElementById("lastUpdated");
    if (el) el.textContent = "Updated " + new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function poll() {
    const [row, tableRows] = await Promise.all([fetchData(), fetchTableScores()]);
    if (!row || !row.data) return;
    compData = row.data.compData || {};
    gymnasts = row.data.gymnasts || [];
    // Scores come exclusively from the scores table
    scores = tableRows.length > 0 ? scoresToFlat(tableRows) : {};
    renderPage();
    updateTimestamp();
  }

  async function init() {
    if (!compId) {
      document.getElementById("main").innerHTML = `
        <div class="state-full">
          <div class="state-icon">🔗</div>
          <div class="state-title">No competition ID</div>
          <div class="state-sub">Please open this link from the competition dashboard. The URL should include <code>?comp=…</code></div>
        </div>`;
      return;
    }

    // Fetch comp data first (needed for lock screen validation)
    const [row, tableRows] = await Promise.all([fetchData(), fetchTableScores()]);
    if (!row || !row.data) {
      document.getElementById("main").innerHTML = `
        <div class="state-full">
          <div class="state-icon">⚠️</div>
          <div class="state-title">Competition not found</div>
          <div class="state-sub">Please check your link or contact the event organiser.</div>
        </div>`;
      return;
    }

    compData = row.data.compData || {};
    gymnasts = row.data.gymnasts || [];
    scores = tableRows.length > 0 ? scoresToFlat(tableRows) : {};

    // Check for saved session
    let savedCode = null;
    try { savedCode = sessionStorage.getItem("coach_club_" + compId); } catch {}

    if (savedCode) {
      const club = (compData.clubs || []).find(c => c.clubCode === savedCode);
      if (club) {
        authedClubCode = savedCode;
        authedClubName = club.name;
        activeView = "myclub";
        renderPage();
        updateTimestamp();
        { const lp = document.getElementById("livePill"); if (lp) lp.style.display = "inline-flex"; }
        pollTimer = setInterval(() => poll(), POLL_MS);
        return;
      }
      // Saved code no longer valid — clear it
      try { sessionStorage.removeItem("coach_club_" + compId); } catch {}
    }

    // No valid session — show lock screen (branded)
    applyBranding(compData);
    renderLockScreen();
  }

  init();
</script>
</body>
</html>
